version: '3.8'

services:
  synvectordb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synvectordb-githubshare
    ports:
      - "8501:8501"
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
      # Optional: mount data directory for updates
      # - ./data:/app/data:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.synvectordb.description=SynVectorDB githubshare demo application"
      - "com.synvectordb.version=1.0.0"
